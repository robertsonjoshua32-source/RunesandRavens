function svgMark(sz, uid) {
  const cx=56, cy=50;
  const rays=[];
  for(let i=0;i<24;i++){
    const a=i*Math.PI/12;
    const x2=(cx+52*Math.cos(a)).toFixed(1);
    const y2=(cy+52*Math.sin(a)).toFixed(1);
    const w=i%2===0?0.8:0.4;
    rays.push(`<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#c8a45a" stroke-width="${w}" opacity="0.5"/>`);
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:${sz}px;height:${sz}px;flex-shrink:0" aria-hidden="true">
  <defs>
    <mask id="cm${uid}">
      <circle cx="38" cy="50" r="34" fill="white"/>
      <circle cx="57" cy="50" r="28" fill="black"/>
    </mask>
  </defs>
  ${rays.join('')}
  <circle cx="38" cy="50" r="34" fill="#c8a45a" mask="url(#cm${uid})" opacity="0.9"/>
  <circle cx="${cx}" cy="${cy}" r="27" fill="#07070d"/>
  <path d="M67,61 L75,83" stroke="#c8a45a" stroke-width="0.9" fill="none" opacity="0.8"/>
  <path d="M69,66 Q75,62 77,67 Q73,68 69,66Z" fill="#c8a45a" opacity="0.72"/>
  <path d="M69,66 Q64,62 62,67 Q65,68 69,66Z" fill="#c8a45a" opacity="0.72"/>
  <path d="M71,72 Q77,68 79,73 Q75,74 71,72Z" fill="#c8a45a" opacity="0.72"/>
  <path d="M71,72 Q66,68 64,73 Q67,74 71,72Z" fill="#c8a45a" opacity="0.72"/>
  <path d="M73,78 Q78,75 80,80 Q76,81 73,78Z" fill="#c8a45a" opacity="0.72"/>
  </svg>`;
}

function todayRune(){
  let seed=localStorage.getItem('rr_seed');
  if(!seed){
    seed=Math.floor(Math.random()*24);
    localStorage.setItem('rr_seed',seed);
  }
  const days=Math.floor((new Date()-new Date(2024,0,1))/86400000);
  return RUNES[(days+parseInt(seed))%RUNES.length];
}
  function pathDay(pathId) {
  const key = 'rr_pathstart_' + pathId;
  let start = localStorage.getItem(key);
  if (!start) {
    start = new Date().toISOString();
    localStorage.setItem(key, start);
  }
  const days = Math.floor((new Date() - new Date(start)) / 86400000);
  return days;
}
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function todaysRuneEntry(){
  const t=new Date().toDateString();

    if(new Date(S.entries[i].date).toDateString()===t&&!S.entries[i].pathId)return{entry:S.entries[i],index:i};
  }
  return null;
}
function todaysPathEntry(){
  const t=new Date().toDateString();
  for(let i=S.entries.length-1;i>=0;i--){
    if(new Date(S.entries[i].date).toDateString()===t&&S.entries[i].pathId)return{entry:S.entries[i],index:i};
  }
  return null;
}
function saveRuneEntry(){
  if(!S.runeText.trim())return;
  const r=todayRune();

  if(S.editRuneIdx>=0){S.entries[S.editRuneIdx]=entry;S.editRuneIdx=-1;}

function savePathEntry(){
  if(!S.pathText.trim())return;

  function themes(){
  const w={};
  const stop=new Set(['the','and','that','this','what','where','you','your','have','been','from','with','not','are','but','for','more','would','will','when','into','like','just','they','them','there','then','also','some','all','its','was','were','about']);
  S.entries.forEach(e=>e.text.toLowerCase().split(/\W+/).forEach(wd=>{if(wd.length>4&&!stop.has(wd))w[wd]=(w[wd]||0)+1;}));
  return Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,6);
}

      const prompt=p.prompts[day];
      const te=todaysPathEntry();
      return `<div class="slbl" style="padding-top:6px">${p.title.toUpperCase()} · DAY ${day+1} OF ${p.days}</div><div class="card"><div style="margin-bottom:8px"><span style="font-size:10px;color:#7a7080;font-style:italic">Path prompt</span></div><p class="ptxt">"${prompt}"</p>${te&&S.editPathIdx<0?`<div style="background:#0e0e18;border:0.5px solid #1e1c2a;border-radius:9px;padding:10px 12px;font-size:14px;color:#ede5d8;font-family:'Crimson Pro',serif;line-height:1.6;margin-bottom:8px">${te.entry.text}</div><button id="editpathbtn" style="background:none;border:0.5px solid #342c1a;border-radius:7px;padding:5px 14px;color:#7a6030;font-size:11px;font-family:'Cinzel',serif;letter-spacing:.06em;cursor:pointer">Edit entry</button>`:`<textarea class="jinp" id="pathinp" rows="4" placeholder="Write what comes up...">${S.pathText||''}</textarea><div style="display:flex;justify-content:space-between;align-items:center"><button class="sbtn" id="savepathbtn">${S.savedPath?'Saved':'Save entry'}</button><span style="font-size:10px;color:#7a7080" id="pathcount">${(S.pathText||'').length} chars</span></div>`}</div>`;
    })():''}
  </div>`;  
}

function bindToday(){
  const pb=document.getElementById('playbtn');
  if(pb)pb.onclick=()=>{S.playRune=true;render();setTimeout(()=>{S.playRune=false;render();},4000);};
  const tm=document.getElementById('togglemean');
  if(tm)tm.onclick=()=>{S.showMeaning=!S.showMeaning;render();};
  const ri=document.getElementById('runeinp');
  if(ri){ri.oninput=e=>{S.runeText=e.target.value;const cc=document.getElementById('runecount');if(cc)cc.textContent=e.target.value.length+' chars';};ri.value=S.runeText||'';}
  const sr=document.getElementById('saverunebtn');
  if(sr)sr.onclick=saveRuneEntry;
  const er=document.getElementById('editrunebtn');
  if(er){const te=todaysRuneEntry();if(te)er.onclick=()=>editRuneEntry(te.index);}
  const pi=document.getElementById('pathinp');
  if(pi){pi.oninput=e=>{S.pathText=e.target.value;const cc=document.getElementById('pathcount');if(cc)cc.textContent=e.target.value.length+' chars';};pi.value=S.pathText||'';}
  const sp=document.getElementById('savepathbtn');
  if(sp)sp.onclick=savePathEntry;
  const ep=document.getElementById('editpathbtn');
  if(ep){const te=todaysPathEntry();if(te)ep.onclick=()=>editPathEntry(te.index);}
}

function renderJournal(){
  const th=themes();
  if(S.entries.length===0){
    return `<div class="fadeu">
      <div class="hdr"><div class="bnm" style="font-family:'Cinzel',serif;color:#e2c98a;font-size:15px;letter-spacing:.1em">Inner Narrative</div><div class="hgreet">Your patterns live here.</div></div>
      <div class="card" style="text-align:center;padding:34px 18px">
        <div style="font-size:34px;margin-bottom:12px;color:#7a6030">ᛈ</div>
        <div style="font-size:14px;color:#7a7080;font-style:italic;line-height:1.7">No entries yet. Return to Today and write your first reflection.</div>
      </div>
    </div>`;
  }
  return `<div class="fadeu">
    <div class="hdr">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div class="bnm" style="font-family:'Cinzel',serif;color:#e2c98a;font-size:15px;letter-spacing:.1em">Inner Narrative</div><div class="hgreet">${S.entries.length} ${S.entries.length===1?'entry':'entries'} written.</div></div>
        <span class="badge">${S.entries.length} total</span>
      </div>
    </div>
    ${th.length>0?`<div class="slbl">Themes surfacing</div><div class="ttags">${th.map(([w,c])=>`<span class="ttag">${w} · ${c}x</span>`).join('')}</div>`:''}
    <div class="slbl">Entries</div>
${[...S.entries].reverse().map(e=>`
      <div class="ecard">
        <div class="ehdr">
          <span class="erune">${e.glyph} ${e.rune}${e.pathId ? ` · <span style="color:#7a6030;font-size:10px">Day ${e.pathDay||''}</span>` : ''}</span>
          <span class="edate">${fmtDate(e.date)}</span>
        </div>
        <div class="etxt">${e.text}</div>
      </div>`).join('')}
      </div>`;
}

function renderPaths(){
  return `<div class="fadeu">
    <div class="hdr"><div class="bnm" style="font-family:'Cinzel',serif;color:#e2c98a;font-size:15px;letter-spacing:.1em">Reading Paths</div><div class="hgreet">Structured journeys in Diana's voice.</div></div>
 
    ${S.path ? (() => {
      const p = PATHS.find(x=>x.id===S.path);
      const day = Math.min(pathDay(S.path), p.days-1);
      const pct = Math.round(((day+1)/p.days)*100);
      const prompt = p.prompts[day];
      return `
        <div class="slbl">In progress</div>
        <div class="pcard acp">
          <div class="phdr"><span class="picw">${p.icon}</span><div style="flex:1"><div class="ptitle">${p.title}</div><div class="pdesc">Day ${day+1} of ${p.days}</div></div><span class="badge">${pct}%</span></div>
          <div class="pbg"><div class="pfill" style="width:${pct}%"></div></div>
        </div>
        <div class="slbl">Today's path prompt</div>
        <div class="card"><p class="ptxt">"${prompt}"</p><div style="font-size:10px;color:#7a7080;margin-top:8px;font-style:italic">Write your response in the Today tab to save it to your journal.</div></div>
        <div style="margin:4px 14px 10px">
          <button onclick="S.path=null;localStorage.removeItem('rr_path2');render()" style="background:none;border:none;color:#3a3545;font-size:11px;font-family:'Cinzel',serif;letter-spacing:.06em;cursor:pointer">Leave this path</button>
        </div>`;
    })() : ''}
 
    <div class="slbl">${S.path ? 'All paths' : 'Choose a path'}</div>
    ${PATHS.map(p=>`
      <div class="pcard${S.path===p.id?' acp':''}" data-pathid="${p.id}">
        <div class="phdr"><span class="picw">${p.icon}</span><div><div class="ptitle">${p.title}</div><div class="pdesc">${p.desc}</div></div></div>
        <div class="pbg"><div class="pfill" style="width:${S.path===p.id ? Math.round(((Math.min(pathDay(p.id),p.days-1)+1)/p.days)*100) : 0}%"></div></div>
      </div>
      ${S.pathExp===p.id ? `<div class="card fadeu" style="margin-top:-5px">
        <div style="font-size:10px;color:#7a6030;font-family:'Cinzel',serif;letter-spacing:.08em;margin-bottom:8px">${p.rune} ${p.days} DAYS</div>
        <p class="pabout">${p.about}</p>
        <div style="font-size:12px;color:#7a7080;margin:8px 0 12px;font-style:italic">Day 1 begins the moment you start. Each day you open the app, the next prompt is waiting.</div>
        <button class="pstrt" data-startpath="${p.id}">${S.path===p.id ? 'Continue path' : 'Begin this path'}</button>
      </div>` : ''}
    `).join('')}
  </div>`;
}
function bindPaths(){
  document.querySelectorAll('[data-pathid]').forEach(c=>{c.onclick=()=>{S.pathExp=S.pathExp===c.dataset.pathid?null:c.dataset.pathid;render();};});
  document.querySelectorAll('[data-startpath]').forEach(b=>{b.onclick=e=>{e.stopPropagation();setPath(b.dataset.startpath);};});
}

function renderLibrary(){
  return `<div class="fadeu">
    <div class="hdr"><div class="bnm" style="font-family:'Cinzel',serif;color:#e2c98a;font-size:15px;letter-spacing:.1em">Rune Library</div><div class="hgreet">All 24 · Elder Futhark</div></div>
    <div class="slbl">Elder Futhark</div>
    <div class="lgrid">${RUNES.map(r=>`<div class="li" data-rune="${r.name}"><div class="lglyph">${r.glyph}</div><div class="lname">${r.name}</div><div class="lkw">${r.kw.split(' · ')[0]}</div></div>`).join('')}</div>
  </div>`;
}
function bindLibrary(){
  document.querySelectorAll('[data-rune]').forEach(el=>{el.onclick=()=>{S.libSel=el.dataset.rune;render();};});
}

function renderDetail(){
  const r=RUNES.find(x=>x.name===S.libSel);if(!r)return'';
  return `<div class="doverlay fadeu">
    <div class="dhdr">
      <button class="bbtn" id="backbtn">&#8592;</button>
      <div style="font-family:'Cinzel',serif;font-size:11px;color:#7a7080;letter-spacing:.1em">Rune Library</div>
      <div style="width:28px"></div>
    </div>
    <div style="text-align:center;padding:26px 18px 14px">
      <div class="rgl">${r.glyph}</div>
      <div class="rnl">${r.name}</div>
      <div class="rkw">${r.kw}</div>
    </div>
    <div class="card"><p class="mtxt">${r.meaning}</p></div>
    <div class="slbl">Journal prompt</div>
    <div class="card"><p class="ptxt">"${r.prompt}"</p></div>
    <div class="slbl">Narrative rewrite</div>
    <div class="card"><div class="rtxt">${r.rewrite}</div></div>
    <div style="padding:0 14px;margin-top:4px">
      <button class="abtn" style="width:100%;justify-content:center">&#9654; Diana's reading</button>
      <div class="anote" style="text-align:center">Audio uploads here once Diana records her readings</div>
    </div>
  </div>`;
}
function bindDetail(){const bb=document.getElementById('backbtn');if(bb)bb.onclick=()=>{S.libSel=null;render();};}

loadState();
</script>
