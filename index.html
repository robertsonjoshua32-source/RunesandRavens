function svgMark(sz, uid) {
  const cx=56, cy=50;
  const rays=[];
  for(let i=0;i<24;i++){
    const a=i*Math.PI/12;
    const x2=(cx+52*Math.cos(a)).toFixed(1);
    const y2=(cy+52*Math.sin(a)).toFixed(1);
    const w=i%2===0?0.8:0.4;
    rays.push(`<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#c8a45a" stroke-width="${w}" opacity="0.5"/>`);
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:${sz}px;height:${sz}px;flex-shrink:0" aria-hidden="true">
  <defs>
    <mask id="cm${uid}">
      <circle cx="38" cy="50" r="34" fill="white"/>
      <circle cx="57" cy="50" r="28" fill="black"/>
    </mask>
  </defs>
  ${rays.join('')}
  <circle cx="38" cy="50" r="34" fill="#c8a45a" mask="url(#cm${uid})" opacity="0.9"/>
  <circle cx="${cx}" cy="${cy}" r="27" fill="#07070d"/>
  <path d="M67,61 L75,83" stroke="#c8a45a" stroke-width="0.9" fill="none" opacity="0.8"/>
  <path d="M69,66 Q75,62 77,67 Q73,68 69,66Z" fill="#c8a45a" opacity="0.72"/>
  <path d="M69,66 Q64,62 62,67 Q65,68 69,66Z" fill="#c8a45a" opacity="0.72"/>
  <path d="M71,72 Q77,68 79,73 Q75,74 71,72Z" fill="#c8a45a" opacity="0.72"/>
  <path d="M71,72 Q66,68 64,73 Q67,74 71,72Z" fill="#c8a45a" opacity="0.72"/>
  <path d="M73,78 Q78,75 80,80 Q76,81 73,78Z" fill="#c8a45a" opacity="0.72"/>
  </svg>`;
}

let S={screen:'onboard',tab:'today',name:'',entries:[],path:null,playRune:false,showMeaning:false,libSel:null,pathExp:null,journalText:'',saved:false};

function loadState(){
  try{const n=localStorage.getItem('rr_name2');if(n)S.name=n;}catch{}
  try{const sc=localStorage.getItem('rr_sub2');if(sc==='true')S.screen='app';}catch{}
  try{const e=localStorage.getItem('rr_entries2');if(e)S.entries=JSON.parse(e);}catch{}
  try{const p=localStorage.getItem('rr_path2');if(p)S.path=p;}catch{}
  render();
}

function doOnboard(n){S.name=n;S.screen='subscribe';localStorage.setItem('rr_name2',n);render();}
function doSubscribe(){S.screen='app';localStorage.setItem('rr_sub2','true');render();}
function setPath(id){S.path=id;S.tab='paths';localStorage.setItem('rr_path2',id);render();}
function saveEntry(){
  if(!S.journalText.trim())return;
  const r=todayRune();
  S.entries.push({rune:r.name,glyph:r.glyph,text:S.journalText,date:new Date().toISOString()});
  S.journalText='';S.saved=true;
  localStorage.setItem('rr_entries2',JSON.stringify(S.entries));
  render();setTimeout(()=>{S.saved=false;render();},2000);
}

function todayRune(){
  const days=Math.floor((new Date()-new Date(2024,0,1))/86400000);
  return RUNES[days%RUNES.length];
}
function fmtDate(iso){return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function themes(){
  const w={};
  const stop=new Set(['the','and','that','this','what','where','you','your','have','been','from','with','not','are','but','for','more','would','will','when','into','like','just','they','them','there','then','also','some','all','its','was','were','about']);
  S.entries.forEach(e=>e.text.toLowerCase().split(/\W+/).forEach(wd=>{if(wd.length>4&&!stop.has(wd))w[wd]=(w[wd]||0)+1;}));
  return Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,6);
}

function render(){
  const app=document.getElementById('app');
  if(!app)return;
  if(S.screen==='onboard'){app.innerHTML=renderOnboard();bindOnboard();return;}
  if(S.screen==='subscribe'){app.innerHTML=renderSub();bindSub();return;}
  app.innerHTML=renderApp();bindApp();
}

function renderOnboard(){
  return `<div class="obwrap fadeu">
    ${svgMark(96,'ob')}
    <div style="font-family:'Cinzel',serif;font-size:19px;letter-spacing:.12em;color:#e2c98a;font-weight:600;margin:14px 0 8px">Runes &amp; Ravens</div>
    <div style="font-size:14px;color:#7a7080;line-height:1.7;font-style:italic;max-width:270px;margin-bottom:32px">A daily self-discovery practice built around the 24 Elder Futhark runes and inner narrative work.</div>
    <input class="obinp" id="obname" placeholder="Your first name" value="${S.name||''}"/>
    <button class="obbtn" id="obgo">Enter</button>
    <div style="font-size:10px;color:#7a7080;margin-top:13px;line-height:1.5;font-style:italic">Created by Diana Robertson · Runes and Ravens LLC</div>
  </div>`;
}
function bindOnboard(){
  document.getElementById('obgo').onclick=()=>{const n=document.getElementById('obname').value.trim();if(n)doOnboard(n);};
  document.getElementById('obname').onkeydown=e=>{if(e.key==='Enter'){const n=e.target.value.trim();if(n)doOnboard(n);}};
}

function renderSub(){
  const feats=[
    {ic:'🌙',t:'Daily rune pull',d:"A new rune every morning, rotated through all 24 Elder Futhark runes with Diana's written interpretation."},
    {ic:'🎙️',t:"Diana's voice readings",d:"Pre-recorded audio for every rune in her own words, available whenever you open the app."},
    {ic:'📖',t:'Inner narrative journal',d:'Write daily. The app surfaces recurring themes from your entries so you can see your patterns over time.'},
    {ic:'🔥',t:'Structured reading paths',d:'Shadow work, relationships, ancestral patterns. 14 to 30 day journeys built for this practice.'},
    {ic:'ᛟ',t:'Full rune library',d:'All 24 Elder Futhark runes with meanings, journal prompts, and narrative rewrites.'},
  ];
  return `<div class="fadeu" style="padding-bottom:30px">
    <div style="text-align:center;padding:44px 22px 22px">
      ${svgMark(80,'sb')}
      <div style="font-family:'Cinzel',serif;font-size:17px;color:#e2c98a;letter-spacing:.1em;margin:12px 0 6px">Runes &amp; Ravens</div>
      <div style="font-size:13px;color:#7a7080;font-style:italic;line-height:1.7;max-width:270px;margin:0 auto">A daily practice in Diana's voice, built to run whenever you need it.</div>
    </div>
    <div class="card">
      ${feats.map(f=>`<div class="suf"><div class="suic">${f.ic}</div><div><div class="sftitle">${f.t}</div><div class="sfdesc">${f.d}</div></div></div>`).join('')}
      <div style="text-align:center;padding:16px 0 4px">
        <span style="font-family:'Cinzel',serif;font-size:30px;color:#e2c98a;font-weight:600">$8</span>
        <span style="font-size:13px;color:#7a7080"> / month</span>
        <div style="font-size:11px;color:#7a7080;margin-top:3px;font-style:italic">Cancel any time.</div>
      </div>
      <button class="subtn" id="subbtn">Begin the practice</button>
      <div style="font-size:10px;color:#7a7080;text-align:center;margin-top:10px;font-style:italic">Secure payment via Stripe</div>
    </div>
  </div>`;
}
function bindSub(){document.getElementById('subbtn').onclick=doSubscribe;}

function renderApp(){
  const tabs=[{id:'today',ic:'🌙',lb:'Today'},{id:'journal',ic:'📖',lb:'Journal'},{id:'paths',ic:'🔥',lb:'Paths'},{id:'library',ic:'ᛈ',lb:'Library'}];
  let screen='';
  if(S.tab==='today')screen=renderToday();
  else if(S.tab==='journal')screen=renderJournal();
  else if(S.tab==='paths')screen=renderPaths();
  else screen=renderLibrary();
  return `<div class="wrap">
    <div class="scroll">${screen}${S.libSel?renderDetail():''}</div>
    <div class="tabbar">${tabs.map(t=>`<button class="tb${S.tab===t.id?' on':''}" data-tab="${t.id}"><span>${t.ic}</span>${t.lb}</button>`).join('')}</div>
  </div>`;
}
function bindApp(){
  document.querySelectorAll('[data-tab]').forEach(b=>{b.onclick=()=>{S.tab=b.dataset.tab;S.libSel=null;render();};});
  if(S.tab==='today')bindToday();
  if(S.tab==='paths')bindPaths();
  if(S.tab==='library')bindLibrary();
  if(S.libSel)bindDetail();
}

function renderToday(){
  const r=todayRune();
  const h=new Date().getHours();
  const gr=h<12?'morning':h<17?'afternoon':'evening';
  const dow=new Date().getDay();
  const days=['S','M','T','W','Th','F','S'];
  return `<div class="fadeu">
    <div class="hdr">
      <div class="brow">
        ${svgMark(46,'hd')}
        <div>
          <div class="bnm">Runes &amp; Ravens</div>
          <div class="bsub">Diana Robertson</div>
        </div>
      </div>
      <div class="hgreet">Good ${gr}${S.name?', '+S.name:''}.</div>
    </div>
    <div class="cardg">
      <div class="rgl">${r.glyph}</div>
      <div class="rnl">${r.name}</div>
      <div class="rkw">${r.kw}</div>
      <button class="abtn${S.playRune?' pl':''}" id="playbtn">
        ${S.playRune?'&#9646;&#9646; Playing Diana\'s reading...':'&#9654; Diana\'s reading'}
      </button>
      <div class="anote">${S.playRune?'Audio uploads here once Diana records her readings.':'Pre-recorded interpretation'}</div>
    </div>
    <div style="text-align:center;padding-top:2px">
      <button id="togglemean" style="background:none;border:none;color:#7a7080;font-size:11px;font-family:'Cinzel',serif;letter-spacing:.07em;cursor:pointer">
        ${S.showMeaning?'hide meaning':'read the full meaning'}
      </button>
    </div>
    ${S.showMeaning?`<div class="card fadeu"><p class="mtxt">${r.meaning}</p><div class="div"></div><div class="rlbl">Narrative rewrite</div><div class="rtxt">${r.rewrite}</div></div>`:''}
    <div class="slbl">Today's prompt</div>
    <div class="card">
      <p class="ptxt">"${r.prompt}"</p>
      <textarea class="jinp" id="jinp" rows="4" placeholder="Write what comes up...">${S.journalText||''}</textarea>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <button class="sbtn" id="savebtn">${S.saved?'Saved':'Save entry'}</button>
        <span style="font-size:10px;color:#7a7080" id="charcount">${(S.journalText||'').length} chars</span>
      </div>
    </div>
    <div class="slbl">This week</div>
    <div class="card" style="padding-bottom:12px">
      <div class="drow">
        ${days.map((d,i)=>`<div class="dd ${i<dow?'done':i===dow?'dtoday':'doff'}">${d}</div>`).join('')}
      </div>
      <div style="font-size:11px;color:#7a7080;margin-top:7px;font-style:italic">${S.entries.length} ${S.entries.length===1?'entry':'entries'} total.</div>
    </div>
  </div>`;
}
function bindToday(){
  const pb=document.getElementById('playbtn');
  if(pb)pb.onclick=()=>{S.playRune=true;render();setTimeout(()=>{S.playRune=false;render();},4000);};
  const tm=document.getElementById('togglemean');
  if(tm)tm.onclick=()=>{S.showMeaning=!S.showMeaning;render();};
  const ji=document.getElementById('jinp');
  if(ji){ji.oninput=e=>{S.journalText=e.target.value;const cc=document.getElementById('charcount');if(cc)cc.textContent=e.target.value.length+' chars';};ji.value=S.journalText||'';}
  const sv=document.getElementById('savebtn');
  if(sv)sv.onclick=saveEntry;
}

function renderJournal(){
  const th=themes();
  if(S.entries.length===0){
    return `<div class="fadeu">
      <div class="hdr"><div class="bnm" style="font-family:'Cinzel',serif;color:#e2c98a;font-size:15px;letter-spacing:.1em">Inner Narrative</div><div class="hgreet">Your patterns live here.</div></div>
      <div class="card" style="text-align:center;padding:34px 18px">
        <div style="font-size:34px;margin-bottom:12px;color:#7a6030">ᛈ</div>
        <div style="font-size:14px;color:#7a7080;font-style:italic;line-height:1.7">No entries yet. Return to Today and write your first reflection.</div>
      </div>
    </div>`;
  }
  return `<div class="fadeu">
    <div class="hdr">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div class="bnm" style="font-family:'Cinzel',serif;color:#e2c98a;font-size:15px;letter-spacing:.1em">Inner Narrative</div><div class="hgreet">${S.entries.length} ${S.entries.length===1?'entry':'entries'} written.</div></div>
        <span class="badge">${S.entries.length} total</span>
      </div>
    </div>
    ${th.length>0?`<div class="slbl">Themes surfacing</div><div class="ttags">${th.map(([w,c])=>`<span class="ttag">${w} · ${c}x</span>`).join('')}</div>`:''}
    <div class="slbl">Entries</div>
    ${[...S.entries].reverse().map(e=>`<div class="ecard"><div class="ehdr"><span class="erune">${e.glyph} ${e.rune}</span><span class="edate">${fmtDate(e.date)}</span></div><div class="etxt">${e.text}</div></div>`).join('')}
  </div>`;
}

function renderPaths(){
  return `<div class="fadeu">
    <div class="hdr"><div class="bnm" style="font-family:'Cinzel',serif;color:#e2c98a;font-size:15px;letter-spacing:.1em">Reading Paths</div><div class="hgreet">Structured journeys in Diana's voice.</div></div>
    ${S.path?`<div class="slbl">In progress</div>${PATHS.filter(p=>p.id===S.path).map(p=>`<div class="pcard acp"><div class="phdr"><span class="picw">${p.icon}</span><div style="flex:1"><div class="ptitle">${p.title}</div><div class="pdesc">${p.desc}</div></div><span class="badge">Active</span></div><div class="pbg"><div class="pfill" style="width:30%"></div></div><div style="font-size:10px;color:#7a7080;margin-top:5px">Day 9 of ${p.days}</div></div>`).join('')}`:''}
    <div class="slbl">${S.path?'All paths':'Choose a path'}</div>
    ${PATHS.map(p=>`
      <div class="pcard${S.path===p.id?' acp':''}" data-pathid="${p.id}">
        <div class="phdr"><span class="picw">${p.icon}</span><div><div class="ptitle">${p.title}</div><div class="pdesc">${p.desc}</div></div></div>
        <div class="pbg"><div class="pfill" style="width:${S.path===p.id?'30':'0'}%"></div></div>
      </div>
      ${S.pathExp===p.id?`<div class="card fadeu" style="margin-top:-5px"><p class="pabout">${p.about}</p><button class="pstrt" data-startpath="${p.id}">${S.path===p.id?'Continue path':'Begin this path'}</button></div>`:''}`
    ).join('')}
  </div>`;
}
function bindPaths(){
  document.querySelectorAll('[data-pathid]').forEach(c=>{c.onclick=()=>{S.pathExp=S.pathExp===c.dataset.pathid?null:c.dataset.pathid;render();};});
  document.querySelectorAll('[data-startpath]').forEach(b=>{b.onclick=e=>{e.stopPropagation();setPath(b.dataset.startpath);};});
}

function renderLibrary(){
  return `<div class="fadeu">
    <div class="hdr"><div class="bnm" style="font-family:'Cinzel',serif;color:#e2c98a;font-size:15px;letter-spacing:.1em">Rune Library</div><div class="hgreet">All 24 · Elder Futhark</div></div>
    <div class="slbl">Elder Futhark</div>
    <div class="lgrid">${RUNES.map(r=>`<div class="li" data-rune="${r.name}"><div class="lglyph">${r.glyph}</div><div class="lname">${r.name}</div><div class="lkw">${r.kw.split(' · ')[0]}</div></div>`).join('')}</div>
  </div>`;
}
function bindLibrary(){
  document.querySelectorAll('[data-rune]').forEach(el=>{el.onclick=()=>{S.libSel=el.dataset.rune;render();};});
}

function renderDetail(){
  const r=RUNES.find(x=>x.name===S.libSel);if(!r)return'';
  return `<div class="doverlay fadeu">
    <div class="dhdr">
      <button class="bbtn" id="backbtn">&#8592;</button>
      <div style="font-family:'Cinzel',serif;font-size:11px;color:#7a7080;letter-spacing:.1em">Rune Library</div>
      <div style="width:28px"></div>
    </div>
    <div style="text-align:center;padding:26px 18px 14px">
      <div class="rgl">${r.glyph}</div>
      <div class="rnl">${r.name}</div>
      <div class="rkw">${r.kw}</div>
    </div>
    <div class="card"><p class="mtxt">${r.meaning}</p></div>
    <div class="slbl">Journal prompt</div>
    <div class="card"><p class="ptxt">"${r.prompt}"</p></div>
    <div class="slbl">Narrative rewrite</div>
    <div class="card"><div class="rtxt">${r.rewrite}</div></div>
    <div style="padding:0 14px;margin-top:4px">
      <button class="abtn" style="width:100%;justify-content:center">&#9654; Diana's reading</button>
      <div class="anote" style="text-align:center">Audio uploads here once Diana records her readings</div>
    </div>
  </div>`;
}
function bindDetail(){const bb=document.getElementById('backbtn');if(bb)bb.onclick=()=>{S.libSel=null;render();};}

loadState();
</script>
